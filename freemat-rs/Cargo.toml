[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
authors = ["Samit Basu <basu.samit@gmail.com>"]
rust-version = "1.96"
repository = "https://github.com/samitbasu/freemat"

# Shared dependency versions live here as stages introduce them, e.g.
#   ndarray = "0.16"
# Crates then opt in with `ndarray.workspace = true`.
[workspace.dependencies]
ndarray = "0.17"
num-complex = "0.4"
# Parser diagnostics (Stage 2). The library defines `Diagnostic`s only; the
# `fancy` feature (graphical rendering) is enabled by the consumer (CLI / tests).
miette = "7.6"
thiserror = "2.0"
# Linear algebra (Stage 5): pure-Rust LU/QR/SVD/eig/Cholesky over column-major
# storage; the fm-core buffer feeds faer near zero-copy.
faer = "0.24"
# PRNG for rand/randn (Stage 5).
rand = "0.9"
rand_distr = "0.5"
# Interactive REPL line editing (Stage 5, fm-cli).
rustyline = "15"
# Graphics scene serialization + websocket wire protocol (Stage 7).
serde = "1"
serde_json = "1"
# Embedded graphics webserver + websocket (Stage 7, fm-cli).
tokio = "1"
axum = "0.8"
futures-util = "0.3"
webbrowser = "1"
# Websocket client (Stage 7) — used by the Milestone-2 integration test.
tokio-tungstenite = "0.24"
# Fast (non-DoS-resistant) hasher for the interpreter's symbol tables — variable
# lookups are a tree-walker hot path and don't need SipHash's collision defence.
rustc-hash = "2"
# Small-vector optimisation for short index/shape vectors (Perf round 2): keeps
# the common low-rank `dims()` / index-plan buffers on the stack (no heap).
smallvec = "1"
# Stage 8 (fm-io): MAT-file I/O, FFT, regex.
# zlib (de)compression for MAT v7 compressed matrix elements.
flate2 = "1"
# Endian-aware reads/writes for the MAT binary layout.
byteorder = "1"
# Pure-Rust FFT for fft/ifft/fft2/ifft2.
rustfft = "6"
# Regular expressions for regexp/regexpi/regexprep.
regex = "1"
# Date/time for the `clock`/`now`/`etime` time builtins (local time + serial
# date-number math). `clock`/`std::env` feature defaults are fine.
chrono = "0.4"
# Help system (P1, fm-doc): distributed `register_doc!` collection + markdown
# dialect parsing. See docs/HELP_SYSTEM.md §0.
inventory = "0.3"
pulldown-cmark = "0.12"

[workspace.lints.rust]
rust_2018_idioms = "warn"

[workspace.lints.clippy]
all = "warn"
