<!doctype html>
<!-- FreeMat-rs graphics frontend (Stage 7).
     Loads Plotly.js from a CDN, opens a websocket back to the embedded fm-cli
     server, and renders each received Figure as a Plotly plot, updating in
     place on every scene message. Plain JS, no build step, no deps but Plotly.
     NOTE: the Plotly CDN <script> needs internet access. To run offline, vendor
     plotly.min.js next to this file and point the <script src> at it. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FreeMat-rs graphics</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; }
      header { padding: 8px 16px; background: #2b3a55; color: #fff; font-size: 14px; }
      #status { float: right; opacity: 0.8; }
      .figure { margin: 12px; border: 1px solid #ddd; background: #fff; border-radius: 4px; }
      .figure > .plot { width: 100%; height: 420px; }
      .empty { padding: 24px; color: #888; }
    </style>
  </head>
  <body>
    <header>
      FreeMat-rs graphics
      <span id="status">connecting…</span>
    </header>
    <div id="figures"><div class="empty" id="placeholder">No figures yet — run <code>plot(...)</code> in the REPL.</div></div>

    <script>
      "use strict";

      // Map FreeMat line styles to Plotly dash patterns.
      const DASH = { "-": "solid", "--": "dash", ":": "dot", "-.": "dashdot" };
      // Map FreeMat marker letters to Plotly marker symbols.
      const MARKERS = {
        "o": "circle", "+": "cross", "*": "star", ".": "circle",
        "x": "x", "s": "square", "d": "diamond", "^": "triangle-up",
        "v": "triangle-down", ">": "triangle-right", "<": "triangle-left",
        "p": "pentagon", "h": "hexagon",
      };

      function lineToTrace(s, idx) {
        let mode = "lines";
        const hasLine = s.line_style && s.line_style.length > 0;
        const hasMarker = s.marker && s.marker.length > 0;
        if (hasLine && hasMarker) mode = "lines+markers";
        else if (hasMarker && !hasLine) mode = "markers";
        const trace = {
          type: "scatter", mode, x: s.x, y: s.y,
          name: s.name || ("series " + (idx + 1)),
          line: { dash: DASH[s.line_style] || "solid" },
        };
        if (s.color) trace.line.color = s.color;
        if (hasMarker) {
          trace.marker = { symbol: MARKERS[s.marker] || "circle" };
          if (s.color) trace.marker.color = s.color;
        }
        return trace;
      }

      // Resolve a series colormap to a Plotly `colorscale`. A name (e.g. "Hot")
      // passes through; an explicit RGB scale arrives as a JSON-array string
      // `[[t,"rgb(r,g,b)"],…]` (from colormap(<Nx3 matrix>)) which we parse.
      function colorScale(cm) {
        if (!cm) return "Viridis";
        if (typeof cm === "string" && cm.charAt(0) === "[") {
          try { return JSON.parse(cm); } catch (e) { return "Viridis"; }
        }
        return cm;
      }

      function surfaceToTrace(s) {
        const t = {
          type: "surface", z: s.z,
          x: (s.xmat && s.xmat.length) ? s.xmat : (s.x && s.x.length ? s.x : undefined),
          y: (s.ymat && s.ymat.length) ? s.ymat : (s.y && s.y.length ? s.y : undefined),
          colorscale: colorScale(s.colormap),
        };
        // surfl: shade with a directional light source.
        if (s.lighting) {
          t.lighting = { ambient: 0.5, diffuse: 0.8, specular: 0.3, roughness: 0.5 };
          t.lightposition = { x: 100, y: 200, z: 1000 };
        }
        // surfc / meshc: project a filled contour onto the z-floor.
        if (s.floor_contour) {
          t.contours = Object.assign(t.contours || {}, {
            z: { show: true, usecolormap: true, project: { z: true } },
          });
        }
        // mesh / meshc: hide the filled surface, show the grid lines both ways.
        if (s.wireframe) {
          t.hidesurface = true;
          t.contours = Object.assign(t.contours || {}, {
            x: { show: true }, y: { show: true },
          });
        }
        // waterfall: hide the surface, draw only the constant-y row curtains.
        if (s.waterfall) {
          t.hidesurface = true;
          t.contours = Object.assign(t.contours || {}, { y: { show: true } });
          if (t.contours.x) t.contours.x = { show: false };
        }
        return t;
      }

      function imageToTrace(s, showscale) {
        return { type: "heatmap", z: s.data, colorscale: colorScale(s.colormap), showscale: !!showscale };
      }

      function pcolorToTrace(s, showscale) {
        return {
          type: "heatmap", z: s.data, colorscale: colorScale(s.colormap),
          x: s.x && s.x.length ? s.x : undefined,
          y: s.y && s.y.length ? s.y : undefined,
          showscale: !!showscale,
        };
      }

      function contourToTrace(s, showscale) {
        const t = {
          type: "contour", z: s.z, colorscale: colorScale(s.colormap),
          x: s.x && s.x.length ? s.x : undefined,
          y: s.y && s.y.length ? s.y : undefined,
          showscale: !!showscale,
        };
        if (s.filled) t.contours = Object.assign(t.contours || {}, { coloring: "fill" });
        else t.contours = Object.assign(t.contours || {}, { coloring: "lines" });
        if (s.labels) t.contours = Object.assign(t.contours || {}, { showlabels: true });
        if (s.levels && s.levels.length) {
          const lo = Math.min.apply(null, s.levels);
          const hi = Math.max.apply(null, s.levels);
          const step = s.levels.length > 1 ? (hi - lo) / (s.levels.length - 1) : (hi - lo) || 1;
          t.contours.start = lo; t.contours.end = hi; t.contours.size = step || 1;
        }
        return t;
      }

      function barToTrace(s, idx) {
        const t = {
          type: "bar", name: s.name || ("series " + (idx + 1)),
        };
        if (s.horizontal) { t.orientation = "h"; t.y = s.x; t.x = s.y; }
        else { t.x = s.x; t.y = s.y; }
        if (s.color) t.marker = { color: s.color };
        return t;
      }

      function stemToTrace(s, idx) {
        // Build vertical stems plus a marker at each tip; scatter with a base.
        const xs = [], ys = [];
        for (let k = 0; k < s.x.length; k++) {
          xs.push(s.x[k], s.x[k], null);
          ys.push(0, s.y[k], null);
        }
        const color = s.color || undefined;
        // The stems are one scatter trace (null-gap segments from base to tip);
        // the tip markers are added as a second trace by the caller.
        return {
          type: "scatter", mode: "lines", x: xs, y: ys, connectgaps: false,
          name: s.name || ("series " + (idx + 1)),
          line: color ? { color } : {},
        };
      }

      function stemMarkers(s, idx) {
        const color = s.color || undefined;
        return {
          type: "scatter", mode: "markers", x: s.x, y: s.y,
          name: s.name || ("series " + (idx + 1)),
          marker: { symbol: MARKERS[s.marker] || "circle", color },
          showlegend: false,
        };
      }

      function stairsToTrace(s, idx) {
        const t = {
          type: "scatter", mode: "lines", x: s.x, y: s.y,
          line: { shape: "hv" },
          name: s.name || ("series " + (idx + 1)),
        };
        if (s.color) t.line.color = s.color;
        return t;
      }

      function errorbarToTrace(s, idx) {
        const t = {
          type: "scatter", mode: "lines+markers", x: s.x, y: s.y,
          error_y: { type: "data", array: s.e, visible: true },
          name: s.name || ("series " + (idx + 1)),
          line: {}, marker: {},
        };
        if (s.color) { t.line.color = s.color; t.marker.color = s.color; t.error_y.color = s.color; }
        return t;
      }

      function line3dToTrace(s, idx) {
        let mode = "lines";
        const hasMarker = s.marker && s.marker.length > 0;
        const hasLine = s.line_style && s.line_style.length > 0;
        if (hasLine && hasMarker) mode = "lines+markers";
        else if (hasMarker && !hasLine) mode = "markers";
        const t = {
          type: "scatter3d", mode, x: s.x, y: s.y, z: s.z,
          name: s.name || ("series " + (idx + 1)),
          line: { dash: DASH[s.line_style] || "solid" },
        };
        if (s.color) { t.line.color = s.color; }
        if (hasMarker) { t.marker = { symbol: MARKERS[s.marker] || "circle" }; if (s.color) t.marker.color = s.color; }
        return t;
      }

      function areaToTrace(s, idx) {
        const t = {
          type: "scatter", mode: "lines", x: s.x, y: s.y, fill: "tozeroy",
          name: s.name || ("series " + (idx + 1)),
          line: {},
        };
        if (s.color) { t.line.color = s.color; t.fillcolor = s.color; }
        return t;
      }

      function fillToTrace(s, idx) {
        const t = {
          type: "scatter", mode: "lines", x: s.x, y: s.y, fill: "toself",
          name: s.name || ("series " + (idx + 1)),
          line: {},
        };
        if (s.color) { t.fillcolor = s.color; t.line.color = s.color; }
        return t;
      }

      function pieToTrace(s) {
        const t = { type: "pie", values: s.values };
        if (s.labels && s.labels.length) t.labels = s.labels;
        return t;
      }

      // Build a polar line trace (theta arrives in radians → Plotly wants degrees).
      function polarToTrace(s, idx) {
        const theta = (s.theta || []).map((a) => a * 180 / Math.PI);
        const t = {
          type: "scatterpolar", mode: "lines", theta, r: s.r,
          name: s.name || ("series " + (idx + 1)),
          line: {},
        };
        if (s.color) t.line.color = s.color;
        return t;
      }

      // Quiver: draw each arrow shaft as a null-gapped scatter line, plus a small
      // markers trace at the arrow tips (a simplified arrowhead).
      function quiverToTrace(s, idx) {
        const xs = [], ys = [], tx = [], ty = [];
        for (let k = 0; k < s.x.length; k++) {
          const x0 = s.x[k], y0 = s.y[k];
          const x1 = x0 + (s.u[k] || 0), y1 = y0 + (s.v[k] || 0);
          xs.push(x0, x1, null);
          ys.push(y0, y1, null);
          tx.push(x1); ty.push(y1);
        }
        const color = s.color || undefined;
        return {
          shaft: {
            type: "scatter", mode: "lines", x: xs, y: ys, connectgaps: false,
            name: s.name || ("series " + (idx + 1)),
            line: color ? { color } : {},
          },
          tips: {
            type: "scatter", mode: "markers", x: tx, y: ty,
            marker: { symbol: "triangle-up", size: 6, color },
            showlegend: false,
          },
        };
      }

      function seriesToTrace(s, i, showscale) {
        if (s.kind === "line") return lineToTrace(s, i);
        if (s.kind === "surface") return surfaceToTrace(s);
        if (s.kind === "image") return imageToTrace(s, showscale);
        if (s.kind === "pcolor") return pcolorToTrace(s, showscale);
        if (s.kind === "contour") return contourToTrace(s, showscale);
        if (s.kind === "bar") return barToTrace(s, i);
        if (s.kind === "stem") return stemToTrace(s, i);
        if (s.kind === "stairs") return stairsToTrace(s, i);
        if (s.kind === "errorbar") return errorbarToTrace(s, i);
        if (s.kind === "line3d") return line3dToTrace(s, i);
        if (s.kind === "area") return areaToTrace(s, i);
        if (s.kind === "fill") return fillToTrace(s, i);
        if (s.kind === "pie") return pieToTrace(s);
        if (s.kind === "polar") return polarToTrace(s, i);
        // quiver / others are handled inline in addAxesToFigure (multi-trace).
        return null;
      }

      // Map FreeMat/MATLAB `view([az, el])` (degrees) to a Plotly camera `eye`
      // (a unit-ish offset of the camera from the scene center). Returns null
      // when no view was requested (Plotly keeps its default camera).
      function viewToEye(view) {
        if (!view || view.length < 2) return null;
        const az = view[0] * Math.PI / 180, el = view[1] * Math.PI / 180;
        const r = 1.8;
        // MATLAB azimuth is measured from the -y axis, rotating toward +x.
        return {
          x: r * Math.cos(el) * Math.sin(az),
          y: -r * Math.cos(el) * Math.cos(az),
          z: r * Math.sin(el),
        };
      }

      // Default full-frame axes position when none is supplied.
      function axPosition(ax) {
        const p = ax.position;
        if (p && p.length === 4) return p;
        return [0, 0, 1, 1];
      }

      // Build a Plotly subplot for one axes: its traces (bound to xaxisN/yaxisN)
      // and the layout entries (axis objects with a `domain` from the position).
      function addAxesToFigure(ax, n, data, layout) {
        const suffix = n === 1 ? "" : String(n);
        const xkey = "xaxis" + suffix, ykey = "yaxis" + suffix;
        const xref = "x" + suffix, yref = "y" + suffix;
        const [left, bottom, w, h] = axPosition(ax);
        // Leave a small inner margin so titles/labels of stacked plots don't
        // collide.
        const pad = 0.06;
        const xdom = [left + pad * w, left + w - pad * w];
        const ydom = [bottom + pad * h, bottom + h - pad * h];

        const xaxis = { title: ax.xlabel || "", showgrid: !!ax.grid, domain: xdom, anchor: yref };
        const yaxis = { title: ax.ylabel || "", showgrid: !!ax.grid, domain: ydom, anchor: xref };
        if (ax.xscale === "log") xaxis.type = "log";
        if (ax.yscale === "log") yaxis.type = "log";
        if (ax.limits) { xaxis.range = [ax.limits.xmin, ax.limits.xmax]; yaxis.range = [ax.limits.ymin, ax.limits.ymax]; }
        if (ax.equal) yaxis.scaleanchor = xref;
        layout[xkey] = xaxis;
        layout[ykey] = yaxis;

        // Polar axes: any polar series binds to a Plotly `polar` subplot with its
        // own domain (mirrors the 3-D scene path but for polar coordinates).
        const hasPolar = (ax.series || []).some((s) => s.kind === "polar");
        const pkey = "polar" + suffix;
        if (hasPolar) {
          layout[pkey] = { domain: { x: [left, left + w], y: [bottom, bottom + h] } };
        }
        // Pie traces take the whole figure cell (no xaxis/yaxis binding); give the
        // pie its own domain so subplots still place it correctly.
        const hasPie = (ax.series || []).some((s) => s.kind === "pie");

        // 3-D axes: any surface/line3d series binds to a Plotly `scene`. Without
        // a `layout.scene*` object Plotly squashes the z-axis, so create one with
        // a balanced "cube" aspect (or true "data" scaling under `axis equal`),
        // a domain for subplots, the z-label, and the requested camera view.
        const is3d = (ax.series || []).some((s) => s.kind === "surface" || s.kind === "line3d");
        if (is3d) {
          const skey = "scene" + suffix;
          const scene = {
            aspectmode: ax.equal ? "data" : "cube",
            domain: { x: [left, left + w], y: [bottom, bottom + h] },
          };
          if ((ax.xlabel || "").length) scene.xaxis = { title: ax.xlabel };
          if ((ax.ylabel || "").length) scene.yaxis = { title: ax.ylabel };
          if ((ax.zlabel || "").length) scene.zaxis = { title: ax.zlabel };
          const eye = viewToEye(ax.view);
          if (eye) scene.camera = { eye };
          layout[skey] = scene;
        }

        const names = (ax.legend && ax.legend.names) || null;
        (ax.series || []).forEach((s, i) => {
          // Quiver is a multi-trace series (shafts + arrowhead markers).
          if (s.kind === "quiver") {
            const q = quiverToTrace(s, i);
            q.shaft.xaxis = xref; q.shaft.yaxis = yref;
            q.tips.xaxis = xref; q.tips.yaxis = yref;
            if (names && names[i]) q.shaft.name = names[i];
            data.push(q.shaft); data.push(q.tips);
            return;
          }
          const t = seriesToTrace(s, i, !!ax.colorbar);
          if (!t) return;
          // Bind each trace to its coordinate system.
          if (s.kind === "surface" || s.kind === "line3d") {
            t.scene = "scene" + suffix;
          } else if (s.kind === "polar") {
            t.subplot = pkey;
          } else if (s.kind === "pie") {
            // Pie takes the whole cell — give it the axes domain, no axis binding.
            t.domain = { x: [left, left + w], y: [bottom, bottom + h] };
          } else {
            t.xaxis = xref; t.yaxis = yref;
          }
          if (names && names[i]) t.name = names[i];
          data.push(t);
          // Stem plots need a second trace for the tip markers.
          if (s.kind === "stem") {
            const m = stemMarkers(s, i);
            m.xaxis = xref; m.yaxis = yref;
            data.push(m);
          }
        });
        // Free-floating text annotations at data coordinates. For a 3-D axes we
        // place them in the scene's annotation list; otherwise on the 2-D axes.
        (ax.texts || []).forEach((tl) => {
          if (is3d && typeof tl.z === "number") {
            const scene = layout["scene" + suffix];
            scene.annotations = scene.annotations || [];
            scene.annotations.push({ x: tl.x, y: tl.y, z: tl.z, text: tl.str, showarrow: false });
          } else {
            layout.annotations = layout.annotations || [];
            layout.annotations.push({
              x: tl.x, y: tl.y, text: tl.str, showarrow: false,
              xref: xref, yref: yref,
            });
          }
        });
        if ((ax.title || "").length) {
          layout.annotations = layout.annotations || [];
          layout.annotations.push({
            text: ax.title, showarrow: false, xref: "paper", yref: "paper",
            x: (xdom[0] + xdom[1]) / 2, y: Math.min(1, ydom[1] + 0.03),
            xanchor: "center", yanchor: "bottom", font: { size: 14 },
          });
        }
      }

      function renderScene(scene) {
        const container = document.getElementById("figures");
        const ph = document.getElementById("placeholder");
        if (ph && scene.figures && scene.figures.length) ph.remove();

        const seen = new Set();
        (scene.figures || []).forEach((fig) => {
          seen.add("fig-" + fig.id);
          let el = document.getElementById("fig-" + fig.id);
          if (!el) {
            el = document.createElement("div");
            el.className = "figure";
            el.id = "fig-" + fig.id;
            const header = document.createElement("div");
            header.style.cssText = "padding:4px 10px;font-size:12px;color:#555;border-bottom:1px solid #eee";
            header.textContent = "Figure " + fig.id;
            const plot = document.createElement("div");
            plot.className = "plot";
            plot.id = "plot-" + fig.id;
            el.appendChild(header);
            el.appendChild(plot);
            container.appendChild(el);
          }
          // Render ALL axes of the figure as Plotly subplots, each given its own
          // xaxisN/yaxisN with a domain derived from its normalized Position.
          const axesList = (fig.axes && fig.axes.length) ? fig.axes : [{ series: [] }];
          const data = [];
          const layout = {
            showlegend: axesList.some((ax) => ax.legend && ax.legend.visible),
            margin: { l: 50, r: 20, t: 30, b: 40 },
          };
          axesList.forEach((ax, idx) => addAxesToFigure(ax, idx + 1, data, layout));
          Plotly.react("plot-" + fig.id, data, layout, { responsive: true });
        });

        // Remove figures that no longer exist (e.g. after clf-all).
        Array.from(container.querySelectorAll(".figure")).forEach((el) => {
          if (!seen.has(el.id)) el.remove();
        });
      }

      // Render a figure to image bytes for `print`/`copy` and reply over the ws.
      function handleCapture(ws, msg) {
        const gd = document.getElementById("plot-" + msg.figure);
        if (!gd) { ws.send(JSON.stringify({type:"image", reqid:msg.reqid, error:"no such figure " + msg.figure})); return; }
        const fmt = (msg.format || "png").toLowerCase();
        Plotly.toImage(gd, { format: fmt })
          .then((dataUrl) => {
            const i = dataUrl.indexOf("base64,");
            const data = i >= 0 ? dataUrl.slice(i + 7) : dataUrl; // raster formats are base64 data URLs
            ws.send(JSON.stringify({ type:"image", reqid: msg.reqid, data }));
          })
          .catch((e) => ws.send(JSON.stringify({ type:"image", reqid: msg.reqid, error: String(e) })));
      }

      function connect() {
        const proto = location.protocol === "https:" ? "wss" : "ws";
        const ws = new WebSocket(proto + "://" + location.host + "/ws");
        const status = document.getElementById("status");
        ws.onopen = () => { status.textContent = "connected"; };
        ws.onclose = () => { status.textContent = "disconnected — retrying…"; setTimeout(connect, 1000); };
        ws.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === "scene") renderScene(msg.scene);
            else if (msg.type === "capture") handleCapture(ws, msg);
          } catch (e) { console.error("bad scene message", e); }
        };
      }
      connect();
    </script>
  </body>
</html>
