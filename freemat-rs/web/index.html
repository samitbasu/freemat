<!doctype html>
<!-- FreeMat-rs graphics frontend (Stage 7).
     Loads Plotly.js from a CDN, opens a websocket back to the embedded fm-cli
     server, and renders each received Figure as a Plotly plot, updating in
     place on every scene message. Plain JS, no build step, no deps but Plotly.
     NOTE: the Plotly CDN <script> needs internet access. To run offline, vendor
     plotly.min.js next to this file and point the <script src> at it. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FreeMat-rs graphics</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; }
      header { padding: 8px 16px; background: #2b3a55; color: #fff; font-size: 14px; }
      #status { float: right; opacity: 0.8; }
      .figure { margin: 12px; border: 1px solid #ddd; background: #fff; border-radius: 4px; }
      .figure > .plot { width: 100%; height: 420px; }
      .empty { padding: 24px; color: #888; }
    </style>
  </head>
  <body>
    <header>
      FreeMat-rs graphics
      <span id="status">connecting…</span>
    </header>
    <div id="figures"><div class="empty" id="placeholder">No figures yet — run <code>plot(...)</code> in the REPL.</div></div>

    <script>
      "use strict";

      // Map FreeMat line styles to Plotly dash patterns.
      const DASH = { "-": "solid", "--": "dash", ":": "dot", "-.": "dashdot" };
      // Map FreeMat marker letters to Plotly marker symbols.
      const MARKERS = {
        "o": "circle", "+": "cross", "*": "star", ".": "circle",
        "x": "x", "s": "square", "d": "diamond", "^": "triangle-up",
        "v": "triangle-down", ">": "triangle-right", "<": "triangle-left",
        "p": "pentagon", "h": "hexagon",
      };

      function lineToTrace(s, idx) {
        let mode = "lines";
        const hasLine = s.line_style && s.line_style.length > 0;
        const hasMarker = s.marker && s.marker.length > 0;
        if (hasLine && hasMarker) mode = "lines+markers";
        else if (hasMarker && !hasLine) mode = "markers";
        const trace = {
          type: "scatter", mode, x: s.x, y: s.y,
          name: s.name || ("series " + (idx + 1)),
          line: { dash: DASH[s.line_style] || "solid" },
        };
        if (s.color) trace.line.color = s.color;
        if (hasMarker) {
          trace.marker = { symbol: MARKERS[s.marker] || "circle" };
          if (s.color) trace.marker.color = s.color;
        }
        return trace;
      }

      function surfaceToTrace(s) {
        return {
          type: "surface", z: s.z,
          x: s.x && s.x.length ? s.x : undefined,
          y: s.y && s.y.length ? s.y : undefined,
          colorscale: s.colormap || "Viridis",
        };
      }

      function imageToTrace(s) {
        return { type: "heatmap", z: s.data, colorscale: s.colormap || "Viridis" };
      }

      function contourToTrace(s) {
        const t = {
          type: "contour", z: s.z, colorscale: s.colormap || "Viridis",
          x: s.x && s.x.length ? s.x : undefined,
          y: s.y && s.y.length ? s.y : undefined,
        };
        if (s.levels && s.levels.length) {
          const lo = Math.min.apply(null, s.levels);
          const hi = Math.max.apply(null, s.levels);
          const step = s.levels.length > 1 ? (hi - lo) / (s.levels.length - 1) : (hi - lo) || 1;
          t.contours = { start: lo, end: hi, size: step || 1 };
        }
        return t;
      }

      function barToTrace(s, idx) {
        const t = {
          type: "bar", name: s.name || ("series " + (idx + 1)),
        };
        if (s.horizontal) { t.orientation = "h"; t.y = s.x; t.x = s.y; }
        else { t.x = s.x; t.y = s.y; }
        if (s.color) t.marker = { color: s.color };
        return t;
      }

      function stemToTrace(s, idx) {
        // Build vertical stems plus a marker at each tip; scatter with a base.
        const xs = [], ys = [];
        for (let k = 0; k < s.x.length; k++) {
          xs.push(s.x[k], s.x[k], null);
          ys.push(0, s.y[k], null);
        }
        const color = s.color || undefined;
        // The stems are one scatter trace (null-gap segments from base to tip);
        // the tip markers are added as a second trace by the caller.
        return {
          type: "scatter", mode: "lines", x: xs, y: ys, connectgaps: false,
          name: s.name || ("series " + (idx + 1)),
          line: color ? { color } : {},
        };
      }

      function stemMarkers(s, idx) {
        const color = s.color || undefined;
        return {
          type: "scatter", mode: "markers", x: s.x, y: s.y,
          name: s.name || ("series " + (idx + 1)),
          marker: { symbol: MARKERS[s.marker] || "circle", color },
          showlegend: false,
        };
      }

      function stairsToTrace(s, idx) {
        const t = {
          type: "scatter", mode: "lines", x: s.x, y: s.y,
          line: { shape: "hv" },
          name: s.name || ("series " + (idx + 1)),
        };
        if (s.color) t.line.color = s.color;
        return t;
      }

      function errorbarToTrace(s, idx) {
        const t = {
          type: "scatter", mode: "lines+markers", x: s.x, y: s.y,
          error_y: { type: "data", array: s.e, visible: true },
          name: s.name || ("series " + (idx + 1)),
          line: {}, marker: {},
        };
        if (s.color) { t.line.color = s.color; t.marker.color = s.color; t.error_y.color = s.color; }
        return t;
      }

      function line3dToTrace(s, idx) {
        let mode = "lines";
        const hasMarker = s.marker && s.marker.length > 0;
        const hasLine = s.line_style && s.line_style.length > 0;
        if (hasLine && hasMarker) mode = "lines+markers";
        else if (hasMarker && !hasLine) mode = "markers";
        const t = {
          type: "scatter3d", mode, x: s.x, y: s.y, z: s.z,
          name: s.name || ("series " + (idx + 1)),
          line: { dash: DASH[s.line_style] || "solid" },
        };
        if (s.color) { t.line.color = s.color; }
        if (hasMarker) { t.marker = { symbol: MARKERS[s.marker] || "circle" }; if (s.color) t.marker.color = s.color; }
        return t;
      }

      function seriesToTrace(s, i) {
        if (s.kind === "line") return lineToTrace(s, i);
        if (s.kind === "surface") return surfaceToTrace(s);
        if (s.kind === "image") return imageToTrace(s);
        if (s.kind === "contour") return contourToTrace(s);
        if (s.kind === "bar") return barToTrace(s, i);
        if (s.kind === "stem") return stemToTrace(s, i);
        if (s.kind === "stairs") return stairsToTrace(s, i);
        if (s.kind === "errorbar") return errorbarToTrace(s, i);
        if (s.kind === "line3d") return line3dToTrace(s, i);
        return null;
      }

      // Default full-frame axes position when none is supplied.
      function axPosition(ax) {
        const p = ax.position;
        if (p && p.length === 4) return p;
        return [0, 0, 1, 1];
      }

      // Build a Plotly subplot for one axes: its traces (bound to xaxisN/yaxisN)
      // and the layout entries (axis objects with a `domain` from the position).
      function addAxesToFigure(ax, n, data, layout) {
        const suffix = n === 1 ? "" : String(n);
        const xkey = "xaxis" + suffix, ykey = "yaxis" + suffix;
        const xref = "x" + suffix, yref = "y" + suffix;
        const [left, bottom, w, h] = axPosition(ax);
        // Leave a small inner margin so titles/labels of stacked plots don't
        // collide.
        const pad = 0.06;
        const xdom = [left + pad * w, left + w - pad * w];
        const ydom = [bottom + pad * h, bottom + h - pad * h];

        const xaxis = { title: ax.xlabel || "", showgrid: !!ax.grid, domain: xdom, anchor: yref };
        const yaxis = { title: ax.ylabel || "", showgrid: !!ax.grid, domain: ydom, anchor: xref };
        if (ax.xscale === "log") xaxis.type = "log";
        if (ax.yscale === "log") yaxis.type = "log";
        if (ax.limits) { xaxis.range = [ax.limits.xmin, ax.limits.xmax]; yaxis.range = [ax.limits.ymin, ax.limits.ymax]; }
        if (ax.equal) yaxis.scaleanchor = xref;
        layout[xkey] = xaxis;
        layout[ykey] = yaxis;

        const names = (ax.legend && ax.legend.names) || null;
        (ax.series || []).forEach((s, i) => {
          const t = seriesToTrace(s, i);
          if (!t) return;
          // 2-D traces bind to this subplot's axes; 3-D surface/line use scene.
          if (s.kind === "surface" || s.kind === "line3d") {
            t.scene = "scene" + suffix;
          } else {
            t.xaxis = xref; t.yaxis = yref;
          }
          if (names && names[i]) t.name = names[i];
          data.push(t);
          // Stem plots need a second trace for the tip markers.
          if (s.kind === "stem") {
            const m = stemMarkers(s, i);
            m.xaxis = xref; m.yaxis = yref;
            data.push(m);
          }
        });
        if ((ax.title || "").length) {
          layout.annotations = layout.annotations || [];
          layout.annotations.push({
            text: ax.title, showarrow: false, xref: "paper", yref: "paper",
            x: (xdom[0] + xdom[1]) / 2, y: Math.min(1, ydom[1] + 0.03),
            xanchor: "center", yanchor: "bottom", font: { size: 14 },
          });
        }
      }

      function renderScene(scene) {
        const container = document.getElementById("figures");
        const ph = document.getElementById("placeholder");
        if (ph && scene.figures && scene.figures.length) ph.remove();

        const seen = new Set();
        (scene.figures || []).forEach((fig) => {
          seen.add("fig-" + fig.id);
          let el = document.getElementById("fig-" + fig.id);
          if (!el) {
            el = document.createElement("div");
            el.className = "figure";
            el.id = "fig-" + fig.id;
            const header = document.createElement("div");
            header.style.cssText = "padding:4px 10px;font-size:12px;color:#555;border-bottom:1px solid #eee";
            header.textContent = "Figure " + fig.id;
            const plot = document.createElement("div");
            plot.className = "plot";
            plot.id = "plot-" + fig.id;
            el.appendChild(header);
            el.appendChild(plot);
            container.appendChild(el);
          }
          // Render ALL axes of the figure as Plotly subplots, each given its own
          // xaxisN/yaxisN with a domain derived from its normalized Position.
          const axesList = (fig.axes && fig.axes.length) ? fig.axes : [{ series: [] }];
          const data = [];
          const layout = {
            showlegend: axesList.some((ax) => ax.legend && ax.legend.visible),
            margin: { l: 50, r: 20, t: 30, b: 40 },
          };
          axesList.forEach((ax, idx) => addAxesToFigure(ax, idx + 1, data, layout));
          Plotly.react("plot-" + fig.id, data, layout, { responsive: true });
        });

        // Remove figures that no longer exist (e.g. after clf-all).
        Array.from(container.querySelectorAll(".figure")).forEach((el) => {
          if (!seen.has(el.id)) el.remove();
        });
      }

      function connect() {
        const proto = location.protocol === "https:" ? "wss" : "ws";
        const ws = new WebSocket(proto + "://" + location.host + "/ws");
        const status = document.getElementById("status");
        ws.onopen = () => { status.textContent = "connected"; };
        ws.onclose = () => { status.textContent = "disconnected — retrying…"; setTimeout(connect, 1000); };
        ws.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === "scene") renderScene(msg.scene);
          } catch (e) { console.error("bad scene message", e); }
        };
      }
      connect();
    </script>
  </body>
</html>
