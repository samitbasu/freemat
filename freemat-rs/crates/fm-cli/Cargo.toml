[package]
name = "fm-cli"
description = "FreeMat-rs terminal REPL and embedded graphics webserver (the `fm` binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "fm"
path = "src/main.rs"

[dependencies]
fm-core = { version = "0.0.0", path = "../fm-core" }
fm-interp = { version = "0.0.0", path = "../fm-interp" }
fm-builtins = { version = "0.0.0", path = "../fm-builtins" }
fm-graphics = { version = "0.0.0", path = "../fm-graphics" }
# P3: the canonical FragmentScript/CapturedFragment now live in fm-doc; the
# capture engine consumes them so there is one shared model (no local copy).
fm-doc = { version = "0.0.0", path = "../fm-doc" }
rustyline.workspace = true
miette = { workspace = true, features = ["fancy"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "net", "macros"] }
axum = { workspace = true, features = ["ws"] }
futures-util.workspace = true
webbrowser.workspace = true
# P2/P3 help-system fragment capture: (de)serialize FragmentScript /
# CapturedFragment JSON for the `fm --capture-fragment` CLI path. The serde
# *derives* now live on the types in fm-doc; fm-cli only needs serde_json here.
serde_json.workspace = true
# P4 browser help: serde derives on the /help/search query + JSON response
# types (axum's Query/Json extractors).
serde = { workspace = true, features = ["derive"] }
# `print`/`copy` round-trip: decode the base64 image bytes the browser returns
# from `Plotly.toImage`. Already in the lock file (transitive) — no new download.
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "net", "macros", "time"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde_json.workspace = true

[lints]
workspace = true
