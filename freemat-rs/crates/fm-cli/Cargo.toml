[package]
name = "fm-cli"
description = "FreeMat-rs terminal REPL and embedded graphics webserver (the `fm` binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "fm"
path = "src/main.rs"

[dependencies]
fm-core = { version = "0.0.0", path = "../fm-core" }
fm-interp = { version = "0.0.0", path = "../fm-interp" }
fm-builtins = { version = "0.0.0", path = "../fm-builtins" }
fm-graphics = { version = "0.0.0", path = "../fm-graphics" }
rustyline.workspace = true
miette = { workspace = true, features = ["fancy"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "net", "macros"] }
axum = { workspace = true, features = ["ws"] }
futures-util.workspace = true
webbrowser.workspace = true
# P2 help-system fragment capture: serialize FragmentScript/CapturedFragment.
# These crates are already in [workspace.dependencies] (used by fm-graphics);
# this only promotes serde_json from dev-deps and adds serde for the derives —
# no new external crates and no edit to the root Cargo.toml.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "net", "macros", "time"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde_json.workspace = true

[lints]
workspace = true
